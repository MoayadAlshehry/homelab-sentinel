name: CI Build & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax & Import Safety
        run: |
          python -m compileall webapp/app webapp/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Frontend Build
        run: |
          cd webapp/frontend
          npm ci
          npm run build

      - name: Verify Docker WebApp Image Build
        run: |
          docker build -t sentinel-webapp:ci webapp/
