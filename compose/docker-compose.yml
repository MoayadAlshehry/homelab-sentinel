name: homelab-sentinel

networks:
  sentinel-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    networks:
      - sentinel-net
    ports:
      - "${PROMETHEUS_PORT:-29090}:9090"
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sentinel-node-exporter
    restart: unless-stopped
    networks:
      - sentinel-net
    ports:
      - "${NODE_EXPORTER_PORT:-29100}:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:9100/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    networks:
      - sentinel-net
    ports:
      - "${GRAFANA_PORT:-23000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_sentinel_pass_change_me}
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: sentinel-uptime-kuma
    restart: unless-stopped
    networks:
      - sentinel-net
    ports:
      - "${UPTIME_KUMA_PORT:-23001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
